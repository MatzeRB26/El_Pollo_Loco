<!doctype html>
<html lang="en" translate="no">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="./assets/icons/hahnchen.png" type="image/x-icon"/>
        <link rel="stylesheet" href="./style.css" />
        <title>El Pollo Loco</title>
        <script type="module" src="./js/game.js"></script>
    </head>
    <body>
        <h1>El Pollo loco</h1>

    <div id="game-container">
            <canvas id="canvas" width="720" height="480"></canvas>

            <div id="startScreen" class="overlay">
                <img src="./assets/img/9_intro_outro_screens/start/startscreen_2.png" alt="Startscreen" />
                <button onclick="startGame()">Start Game</button>
            </div>

            <div id="you-win" class="overlay hidden">
                <img class="endscreen-img" src="assets/img/You won, you lost/You Win A.png" alt="You Win">
                <div class="endscreen-button">
                    <img onclick="returnToMenu()" id="home" class="menu-btn hover" src="./assets/icons/frontPage.png" >
                    <img onclick="restartGame()" id="restart" class="return-btn hover" src="./assets/icons/restart.png" >
                </div>
            </div>

            <div id="game-over" class="overlay hidden">
                <img class="endscreen-img" src="assets/img/You won, you lost/You lost b.png" alt="Game Over"/>
                <div class="endscreen-button">
                    <img onclick="returnToMenu()" id="home" class="menu-btn hover" src="./assets/icons/frontPage.png" >
                    <img onclick="restartGame()" id="restart" class="return-btn hover" src="./assets/icons/restart.png" >
                </div>
            </div>

        <div id="help-dialog" class="hidden">
            <h2>Controls</h2>
        <div class="control">
            <img src="./assets/icons/arrowLeft.png" alt="arrowLeft">
            <p>Move Left</p>
        </div>
        <div class="control">
            <img src="./assets/icons/arrowRight.png" alt="arrowRight">
            <p>Move Right</p>
        </div>
        <div class="control">
            <img src="./assets/icons/space.png" alt="space">
            <p>Jump</p>
        </div>
        <div class="control">
            <img src="./assets/icons/keyD.png" alt="taste d">
            <p>Throw Bottle</p>
        </div>
            <button onclick="toggleHelp()">Close</button>
        </div>
    </div>

    <div id="imprint-dialog" class="dialog hidden">
        <span class="close-btn" onclick="toggleImprint()">&times;</span>
        <h2>Impressum</h2>
        <p>
        Matthäus Stojak<br>
        Geht dich nichts an Straße 18<br>
        12345 Japan
        </p>
        <p>
        E-Mail: jdmfreak@googlemail.com
        </p>
    </div>

        <footer>
            <img onclick="toggleSound()" id="sound-btn" class="sound" src="./assets/icons/soundOn.png" alt="sounds">
            <img onclick="toggleHelp()" id="help" class="help-ctr" src="./assets/icons/controls.png" alt="controls">
            <img onclick="toggleFullscreen()" id="open-fullscreen" class="fullscreen" src="./assets/icons/fullscreen.png"/>
            <img onclick="toggleImprint()" id="imprint-btn" class="info" src="./assets/icons/info-button.png" alt="impressum">
        </footer>
    </body>
</html>
