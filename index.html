<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            href="./assets/icons/hahnchen.png"
            type="image/x-icon"
        />
        <link rel="stylesheet" href="./style.css" />
        <title>El Pollo Loco</title>
        <script type="module" src="./js/game.js"></script>
    </head>
    <body>
        <h1>El Pollo loco</h1>

        <div id="game-container">
            <canvas id="canvas" width="720" height="480"></canvas>
            <div id="startScreen" class="overlay">
                <img src="./assets/img/9_intro_outro_screens/start/startscreen_2.png" alt="Startscreen" />
                <button onclick="startGame()">Start Game</button>
            </div>

        <div id="you-win" class="overlay hidden">
                <img src="assets/img/You won, you lost/You Win A.png" alt="You Win">
            </div>
        </div>
            
        <div id="game-over" class="overlay hidden">
                <img src="assets/img/You won, you lost/Game over A.png" alt="Game Over"/>
        </div>

        <footer>
            <img id=home class="menu-btn hover" src="./assets/icons/frontPage.png" onclick="returnToMenu()">
            <img id=restart class="return-btn hover" src="./assets/icons/restart.png" onclick="restartGame()">
            <img onclick="toggleFullscreen()" id="open-fullscreen" src="./assets/icons/fullscreen.png"class="fullscreen hover"/>
        </footer>
    </body>
</html>
